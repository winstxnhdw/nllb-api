name: CUDA

on:
  pull_request:
  push:
    paths:
      - .github/workflows/cuda.yml
      - .dockerignore
      - Dockerfile.build
      - uv.lock
      - pyproject.toml
      - server/**
      - language/**

jobs:
  build:
    uses: winstxnhdw/actions/.github/workflows/docker-build.yml@10339f0c31654e18c00d8c7256351ba78bcb2ef7 # main
    with:
      file: Dockerfile.build
      cache-mode: min
      build-args: |
        USE_CUDA=1
