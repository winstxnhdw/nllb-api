[project]
name = "nllb-api"
version = "4.2.0"
description = "A fast CPU-based API for NLLB"
requires-python = ">=3.14.7, <3.15"
dependencies = [
    "ctranslate2>=4.8.1",
    "granian>=2.8.2",
    "litestar>=2.24.0",
    "pydantic-settings>=2.15.0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "picologging>=0.9.3; python_version < '3.13'",
    "tokenizers>=0.23.1",
    "aiohttp>=3.14.3",
    "language",
    "opentelemetry-instrumentation-asgi>=0.58b0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "fast-query-parsers>=1.0.3",
    "opentelemetry-instrumentation-system-metrics>=0.58b0",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12>=12.9.2.10"]

[project.scripts]
nllb-api = "server:main"
nllb-api-stub = "server.scripts:stub"
docker-cpu = "server.scripts:cpu"
docker-gpu = "server.scripts:gpu"
docker-hf = "server.scripts:huggingface"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.165.10",
    "nllb",
    "nodejs-wheel-binaries>=24.19.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-env>=1.7.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "server"
source-exclude = ["**/typings"]

[tool.uv.sources]
language = { path = "language" }
nllb = { path = "client" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # pydocstyle docstring rules
    "Q",      # flake8-quotes rules
    "TC",     # flake8-type-checking rules
    "ANN001", # missing-type-function-argument
    "ANN002", # missing-type-args
    "PLC0414", # useless-import-alias
    "INP001", # implicit-namespace-package
    "S104",   # hardcoded-bind-all-interfaces
    "S603",   # subprocess-without-shell-equals-true
    "PYI001", # unprefixed-type-param
    "COM812", # missing-trailing-comma
    "SLF001", # private-member-access
    "PT013",  # pytest-incorrect-pytest-import
    "PLR0913", # too-many-arguments
    "D203",   # one-blank-line-before-class
    "D212",   # multi-line-summary-first-line
]

[tool.pyright]
stubPath = "server/typings"
typeCheckingMode = "strict"
reportUnknownVariableType = false
reportUnknownMemberType = false
reportMissingTypeStubs = false
reportPrivateUsage = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pytest_env]
TESTING = "True"
AUTH_TOKEN = "testtoken"
